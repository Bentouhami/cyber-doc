allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Dependency-provided instructions are not part of CyberDoc's reviewed AI policy.
skills:
  dirs: []

# Temporary transitive pins for published security advisories. Remove each pin
# when every direct parent resolves a patched version on its own.
overrides:
  '@xmldom/xmldom@>=0.7.0 <0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  'brace-expansion@<2.0.2': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'fast-uri@<3.1.9': 3.1.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@<3.3.18': 3.3.18
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
