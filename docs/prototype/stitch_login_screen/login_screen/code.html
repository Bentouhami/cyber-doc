<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تسجيل الدخول</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0D47A1",
            "background-light": "#F5F5F5",
            "background-dark": "#102216",
            "accent": "#FFC107",
            "text-light": "#424242",
            "text-dark": "#E0E0E0",
          },
          fontFamily: {
            "display": ["Public Sans"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
        --zellige-pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23E0E0E0' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .bg-zellige {
        background-image: var(--zellige-pattern);
    }
    .dark .bg-zellige {
         --zellige-pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23424242' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .form-input:focus-within, .form-input:focus {
        border-color: #FFC107 !important;
        box-shadow: 0 0 0 1px #FFC107;
    }
  </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark bg-zellige group/design-root overflow-x-hidden" style='font-family: "Public Sans", "Noto Sans", sans-serif;'>
<div class="layout-container flex h-full grow flex-col">
<header class="flex w-full items-center justify-between p-6 sm:p-8">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/20 dark:bg-primary/30">
<span class="material-symbols-outlined text-primary text-2xl">
              description
            </span>
</div>
<span class="text-xl font-bold text-text-light dark:text-text-dark">خدمات</span>
</div>
<button class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-text-light hover:bg-black/5 dark:text-text-dark dark:hover:bg-white/5">
<span class="material-symbols-outlined text-lg">language</span>
<span>Français</span>
</button>
</header>
<main class="flex flex-1 items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm dark:border-gray-700 dark:bg-gray-800">
<div class="flex min-w-72 flex-col gap-3 mb-8">
<p class="text-[#0d1b12] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">مرحبا بعودتك</p>
<p class="text-text-light dark:text-text-dark text-base font-normal leading-normal">الرجاء إدخال التفاصيل الخاصة بك لتسجيل الدخول</p>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="flex flex-col gap-1">
<label class="text-[#0d1b12] dark:text-white text-base font-medium leading-normal pb-2" for="email">البريد الإلكتروني</label>
<div class="relative">
<div class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400">mail</span>
</div>
<input autocomplete="email" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b12] dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 bg-[#f8fcf9] dark:border-gray-600 dark:bg-gray-700 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] ps-12 text-base font-normal leading-normal" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required="" type="email" value=""/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[#0d1b12] dark:text-white text-base font-medium leading-normal pb-2" for="password">كلمة المرور</label>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<div class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400">lock</span>
</div>
<input autocomplete="current-password" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b12] dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 bg-[#f8fcf9] dark:border-gray-600 dark:bg-gray-700 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] ps-12 text-base font-normal leading-normal" id="password" name="password" placeholder="أدخل كلمة المرور الخاصة بك" required="" type="password" value=""/>
<button class="text-gray-500 dark:text-gray-400 absolute inset-y-0 end-0 flex items-center pe-3.5" data-icon="Eye" data-size="24px" data-weight="regular" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-accent dark:bg-gray-700 dark:border-gray-600" id="mfa" name="mfa" type="checkbox"/>
<label class="mr-2 block text-sm text-text-light dark:text-text-dark" for="mfa">تفعيل المصادقة الثنائية</label>
</div>
<div class="text-sm">
<a class="font-medium text-accent hover:text-accent/80" href="#">هل نسيت كلمة المرور؟</a>
</div>
</div>
<div>
<button class="group relative flex w-full justify-center rounded-lg border border-transparent bg-primary px-4 py-4 text-sm font-bold text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-gray-800" type="submit">
                  تسجيل الدخول
                </button>
</div>
</form>
</div>
<p class="mt-10 text-center text-sm text-gray-500 dark:text-gray-400">
            © 2023 خدمات. كل الحقوق محفوظة.
          </p>
</div>
</main>
</div>
</div>
</body></html>
