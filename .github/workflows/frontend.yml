name: Frontend CI
on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "prisma/**"
      - "scripts/**"
      - "locales/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/frontend.yml"

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: i18n audit
        run: npm run i18n:audit

      - name: Build
        run: npm run build

  critical-smoke:
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E smoke suite
        run: npm run test:e2e:critical

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-smoke-artifacts
          path: |
            tmp/permissions-smoke/results.json
            tmp/admin-smoke/results.json
            tmp/documents-smoke/results.json
            tmp/ux-check/results.json
            tmp/e2e-critical/results.json
